name: Stage B offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (no API credentials or dependencies)
        run: python -m unittest discover -s tests -v
      - name: Validate six-section fixture
        run: python -m src.writing validate --package examples/research_package.json --v0 examples/v0.json
      - name: Offline bounded-loop demonstration
        run: python -m src.writing demo --output runs/ci-demo
